<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile View</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            background-color: #f5f5f5;
        }
        
        .mobile-container {
            width: 375px;
            height: 100%;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .mobile-content {
            width: 100%;
            height: 100%;
            border: none;
        }

        .iframe-container {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: 100vh; /* Set your desired height */
}

.iframe-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: calc(100% + 17px); /* Add extra width to hide scrollbar */
  height: 100%;
  border: none;
}
    </style>
</head>
<body>
    <div class="mobile-container"><div class="iframe-container">
        <iframe class="mobile-content" src="app.html"></iframe>
    </div></div>

</body>
</html>
